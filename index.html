<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
    *{
        padding: 0%;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                      url('https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcSYDpge1TVO3qsRgMrPXaoczl_9LGT4AUoty4L26CFfAHeQRDJI30iKYtx6qHbpcHQMukPpc9M5kKcAPAc');
                       background-position: center;
       background-repeat: no-repeat;
       background-size:cover;
       background-attachment:fixed;
       color: white;
}
    h1 {
        text-align: center;
        color: #f7f7f7;
        font-family: 'Black Ops One', cursive;
        font-weight: bolder;
        font-size: 50px;

    }
    h2{
        text-align: center;
        color: #fdfafa;
        font-family: 'Black Ops One', cursive;
        font-weight: bolder;
        font-size: 40px;
        text-decoration: underline;
    }
    p {
        margin: 0px auto;
        line-height: 1.6;
        max-width: 800px;
        padding-bottom: 40px;
        text-align: center;
    }
  
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}


.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.8);
}
</style>
</head>
<body>
    <h1>Portfolio</h1>
    <p>My name is Owen and I am 22 years old. I am a web developer and I am very committed to my work of web development.<br>You will be able to see some of my work in my gallery. Feel free to scroll down to it.</p>
    
    <h2>My Gallery</h2>
    <div class="gallery">
        <img src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQURRpV6r2Q5OnCY3jDzrHEzHMu-Lv4C7IhPKjQ3BSjGfkXJ7Rn1zmrrSYyBZXuOQ_87ci_oxHIuyhDi00" alt="Web developer workspace">
        <img src="https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcRbluWfIuwNTwObThel90wQ0SGauZ7ypzO7Ed66g-jEpL2qvYEc5Q-G-f3vlc8UfUNtSWN8d53FWFhc7wc" alt="Modern coding environment">
        <img src="https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcRzx5NTKfYnlyemI6Qo3kvfWO7xHh4Pe0BwJceZ1l_pk_r97c2yrhZSFZL_c7ZwM87uFi84fBHQM8slOYA" alt="UI/UX design wireframing">
        <img src="https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcQOlkfvtbsFfVeuHAgUzk9XWEd3Mm_5DY_0f1eqhRYTXcpWUsTQYbAk2qN6mfKEbVw9LZjNg0yQfBK3o2E" alt="Programmer typing on keyboard">
    </div>

</body>
</html>
